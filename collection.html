<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi — BLANK. Custom Apparel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Caveat:wght@700&family=Archivo+Black&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <section class="section" style="padding-bottom:20px">
      <div class="section-head">
        <span class="eyebrow">Koleksi Tema</span>
        <h2 class="section-title">Enam koleksi, <em>satu cerita</em> tiap gaya</h2>
        <p class="section-sub">Setiap koleksi berisi beberapa produk dengan tema desain yang serupa — tinggal pilih, lalu ubah sesuai selera di Custom Studio.</p>
      </div>
      <div id="collRoot"></div>
    </section>
  </div>

  <script src="js/store.js"></script>
  <script>
    document.getElementById('collRoot').innerHTML = COLLECTIONS.map(function (c) {
      return `<section class="coll" id="${c.id}">
        <div class="coll-head">
          <div style="max-width:560px">
            <span class="eyebrow">Koleksi</span>
            <h2 class="section-title" style="margin-bottom:8px">${c.name}</h2>
            <p class="section-sub" style="font-size:14.5px">${c.desc}</p>
          </div>
          <div class="coll-tags">${c.tags.map(t => `<span class="tagpill">${t}</span>`).join('')}</div>
        </div>
        <div class="grid grid-3">${c.items.map(it => collectionCard(c, it)).join('')}</div>
      </section>`;
    }).join('');
  </script>
</body>
</html>
